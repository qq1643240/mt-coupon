<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>后台管理 · 美团津贴</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f3f4f7; color: #1c1c1e; padding: 18px; max-width: 680px; margin: 0 auto; }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 12px; margin-bottom: 16px; }
  .card { background: #fff; border: 1px solid #e6e6e6; border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .sec-t { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  label { display: block; font-size: 12px; color: #666; margin: 10px 0 4px; }
  input { width: 100%; border: 1px solid #dcdcdc; border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; }
  button { cursor: pointer; border: none; border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 600; }
  .btn-primary { background: #1c1c1e; color: #FFC93C; }
  .btn-ghost { background: #eee; color: #333; }
  .btn-danger { background: #ef4444; color: #fff; }
  .item { border: 1px solid #eee; border-radius: 10px; padding: 10px; margin-top: 10px; display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .item .meta { flex: 1; min-width: 0; font-size: 13px; word-break: break-all; }
  .item .meta b { font-size: 14px; }
  .item a { color: #0066cc; font-size: 12px; word-break: break-all; }
  .hidden { display: none; }
  #loginBox { max-width: 300px; margin: 80px auto; background: #fff; border: 1px solid #e6e6e6; border-radius: 14px; padding: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
  .tip { color: #c00; font-size: 12px; margin-top: 8px; min-height: 14px; }
  textarea { width: 100%; border: 1px solid #dcdcdc; border-radius: 10px; padding: 10px; font-size: 14px; font-family: inherit; resize: vertical; }
  .hint { color: #999; font-size: 11px; margin-top: 4px; }

</style>
  <!-- 浏览器端 OCR 引擎（免密钥，WASM），用于把图片识别成文字后再解析 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div id="loginBox">
    <h1>后台登录</h1>
    <p class="sub">密码取环境变量 ADMIN_PASS（默认 mt6866admin）</p>
    <label>密码</label>
    <input id="pass" type="password" placeholder="请输入后台密码" />
    <button class="btn-primary" id="loginBtn" style="margin-top:12px;width:100%">登录</button>
    <p class="tip" id="loginTip"></p>
  </div>

  <div id="adminBox" class="hidden">
    <h1>后台管理 · 美团津贴</h1>
    <p class="sub">活动链接与定位点会展示在前端「领券」「定位」页面</p>

    <div class="card">
      <div class="sec-t">修改管理员密码</div>
      <label>当前密码</label>
      <input id="curPass" type="password" placeholder="当前密码" />
      <label>新密码（至少 4 位）</label>
      <input id="newPass" type="password" placeholder="新密码" />
      <button class="btn-primary" id="chgPass" style="margin-top:12px">修改密码</button>
      <p class="tip" id="chgTip"></p>
    </div>

    <div class="card">
      <div class="sec-t">领券</div>
      <label>智能识别（粘贴文字 / 链接，或上传图片 OCR）</label>
      <textarea id="actText" placeholder="粘贴整段话术或链接，如：「肯德基宅急送」满30减12 https://... 或 #小程序://..."></textarea>
      <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
        <input id="actImg" type="file" accept="image/*" style="flex:1;font-size:13px" />
        <button class="btn-ghost" id="actSmart" type="button">智能识别</button>
      </div>
      <p class="hint">文字 / 图片 / 链接 一键识别，自动填入下方表单（链接同时抓取网页标题与描述）</p>
      <label>标题</label>
      <input id="actTitle" placeholder="如：周三外卖节 满30减12" />
      <label>活动链接（点击即跳转领取）</label>
      <input id="actUrl" placeholder="https://..." />
      <label>备注（选填）</label>
      <input id="actNote" placeholder="选填" />
      <button class="btn-primary" id="actAdd" style="margin-top:12px">添加活动链接</button>
      <div id="actList"></div>
    </div>

    <div class="card">
      <div class="sec-t">定位</div>
      <label>智能识别（粘贴文字 / 链接，或上传图片 OCR）</label>
      <textarea id="locText" placeholder="粘贴含地名/经纬度的文字，如：抚州市南城县 经度：116.636999 纬度：27.569889"></textarea>
      <div style="display:flex;gap:10px;align-items:center;margin-top:8px">
        <input id="locImg" type="file" accept="image/*" style="flex:1;font-size:13px" />
        <button class="btn-ghost" id="locSmart" type="button">智能识别</button>
      </div>
      <p class="hint">文字 / 图片 / 链接 一键识别，自动填入下方表单（地名 / 纬度 / 经度 自动判别）</p>
      <div class="row">
        <div><label>地名</label><input id="locPlace" placeholder="如：深圳南山科技园" /></div>
        <div><label>纬度 lat</label><input id="locLat" placeholder="22.53" /></div>
        <div><label>经度 lng</label><input id="locLng" placeholder="113.95" /></div>
      </div>
      <label>备注（选填）</label>
      <input id="locNote" placeholder="选填" />
      <button class="btn-primary" id="locAdd" style="margin-top:12px">添加定位点</button>
      <div id="locList"></div>
    </div>
  </div>

<script>
var TOKEN = '';
function api(method, path, body) {
  var h = { 'Content-Type': 'application/json' };
  if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
  return fetch(path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined })
    .then(function (r) { return r.json(); });
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
document.getElementById('loginBtn').onclick = function () {
  var p = document.getElementById('pass').value;
  fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: p }) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (j.ok) {
        TOKEN = j.token;
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('adminBox').classList.remove('hidden');
        loadAll();
      } else {
        document.getElementById('loginTip').textContent = j.error || '密码错误';
      }
    });
};
function renderActs(list) {
  var box = document.getElementById('actList'); box.innerHTML = '';
  (list || []).forEach(function (it) {
    var d = document.createElement('div'); d.className = 'item';
    d.innerHTML = '<div class="meta"><b>' + esc(it.title || '未命名') + '</b><br><a href="' + esc(it.url) + '" target="_blank">' + esc(it.url) + '</a>' + (it.note ? '<br>' + esc(it.note) : '') + '</div>';
    var ed = document.createElement('button'); ed.className = 'btn-ghost'; ed.textContent = '编辑';
    ed.onclick = function () { document.getElementById('actTitle').value = it.title || ''; document.getElementById('actUrl').value = it.url || ''; document.getElementById('actNote').value = it.note || ''; window.__editAct = it.id; };
    var del = document.createElement('button'); del.className = 'btn-danger'; del.textContent = '删除';
    del.onclick = function () { if (confirm('删除该活动链接？')) api('DELETE', '/api/acts/' + it.id).then(loadActs); };
    d.appendChild(ed); d.appendChild(del); box.appendChild(d);
  });
}
function renderLocs(list) {
  var box = document.getElementById('locList'); box.innerHTML = '';
  (list || []).forEach(function (it) {
    var d = document.createElement('div'); d.className = 'item';
    d.innerHTML = '<div class="meta"><b>' + esc(it.place || '未命名') + '</b><br>' + esc(it.lat) + ', ' + esc(it.lng) + (it.note ? '<br>' + esc(it.note) : '') + '</div>';
    var ed = document.createElement('button'); ed.className = 'btn-ghost'; ed.textContent = '编辑';
    ed.onclick = function () { document.getElementById('locPlace').value = it.place || ''; document.getElementById('locLat').value = it.lat || ''; document.getElementById('locLng').value = it.lng || ''; document.getElementById('locNote').value = it.note || ''; window.__editLoc = it.id; };
    var del = document.createElement('button'); del.className = 'btn-danger'; del.textContent = '删除';
    del.onclick = function () { if (confirm('删除该定位点？')) api('DELETE', '/api/locs/' + it.id).then(loadLocs); };
    d.appendChild(ed); d.appendChild(del); box.appendChild(d);
  });
}
function loadActs() { api('GET', '/api/acts').then(function (j) { renderActs(j.data); }); }
function loadLocs() { api('GET', '/api/locs').then(function (j) { renderLocs(j.data); }); }
function loadAll() { loadActs(); loadLocs(); }
document.getElementById('actAdd').onclick = function () {
  var body = { title: document.getElementById('actTitle').value, url: document.getElementById('actUrl').value, note: document.getElementById('actNote').value };
  if (!body.url) { alert('请填写活动链接'); return; }
  var p = window.__editAct ? api('PUT', '/api/acts/' + window.__editAct, body) : api('POST', '/api/acts', body);
  p.then(function () { window.__editAct = null; document.getElementById('actTitle').value = ''; document.getElementById('actUrl').value = ''; document.getElementById('actNote').value = ''; loadActs(); });
};
document.getElementById('locAdd').onclick = function () {
  var body = { place: document.getElementById('locPlace').value, lat: document.getElementById('locLat').value, lng: document.getElementById('locLng').value, note: document.getElementById('locNote').value };
  if (!body.place) { alert('请填写地名'); return; }
  var p = window.__editLoc ? api('PUT', '/api/locs/' + window.__editLoc, body) : api('POST', '/api/locs', body);
  p.then(function () { window.__editLoc = null; document.getElementById('locPlace').value = ''; document.getElementById('locLat').value = ''; document.getElementById('locLng').value = ''; document.getElementById('locNote').value = ''; loadLocs(); });
};
/* 从文字中提取第一个链接（http(s) / #小程序 / weixin 等） */
function firstUrl(text) {
  var m = String(text || '').match(/(?:https?:\/\/|#小程序:\/\/|weixin:\/\/|imeituan:\/\/|meituanwaimai:\/\/)[^\s"'<>）)\]]+/i);
  return m ? m[0] : null;
}

/* 浏览器端 OCR：把图片转成文字（Tesseract.js，中文+英文） */
function ocrImage(file) {
  return new Promise(function (resolve, reject) {
    if (typeof Tesseract === 'undefined') { reject(new Error('OCR 引擎未加载（请检查网络后刷新）')); return; }
    Tesseract.recognize(file, 'chi_sim+eng', { logger: function () {} })
      .then(function (r) { resolve(r.data.text || ''); })
      .catch(function (e) { reject(e); });
  });
}

/* 领券：智能识别（文字 / 图片OCR / 链接 合一 → 后端 /api/analyze + /api/import → 回填） */
document.getElementById('actSmart').onclick = function () {
  var text = document.getElementById('actText').value.trim();
  var file = document.getElementById('actImg').files[0];
  var btn = this;
  if (!text && !file) { alert('请粘贴文字 / 链接，或上传图片'); return; }
  btn.disabled = true; btn.textContent = '识别中…';
  var done = function (t) {
    if (!t) { btn.disabled = false; btn.textContent = '智能识别'; alert('未识别到文字内容'); return; }
    var link = firstUrl(t);
    var imp = link ? api('GET', '/api/import?url=' + encodeURIComponent(link)) : Promise.resolve(null);
    var anz = api('POST', '/api/analyze', { text: t });
    Promise.all([imp, anz]).then(function (rs) {
      btn.disabled = false; btn.textContent = '智能识别';
      var im = rs[0], j = rs[1];
      if (!j || !j.ok) { alert('识别失败'); return; }
      var title = (im && im.ok && im.title) ? im.title : j.title;
      var note = (im && im.ok && im.note) ? im.note : j.note;
      var url = link || (j.urls && j.urls[0]) || (im && im.finalUrl) || (j.poi ? j.poi : '');
      if (title) document.getElementById('actTitle').value = title;
      if (note) {
        var n = document.getElementById('actNote').value;
        document.getElementById('actNote').value = (n ? n + ' ' : '') + note;
      }
      if (url) document.getElementById('actUrl').value = url;
    }).catch(function () { btn.disabled = false; btn.textContent = '智能识别'; alert('识别失败'); });
  };
  if (text) { done(text); }
  else { ocrImage(file).then(done).catch(function (e) { btn.disabled = false; btn.textContent = '智能识别'; alert('OCR 失败：' + e.message); }); }
};

/* 定位：智能识别（文字 / 图片OCR / 链接 合一 → 后端 /api/analyze + /api/import → 回填） */
document.getElementById('locSmart').onclick = function () {
  var text = document.getElementById('locText').value.trim();
  var file = document.getElementById('locImg').files[0];
  var btn = this;
  if (!text && !file) { alert('请粘贴文字 / 链接，或上传图片'); return; }
  btn.disabled = true; btn.textContent = '识别中…';
  var done = function (t) {
    if (!t) { btn.disabled = false; btn.textContent = '智能识别'; alert('未识别到文字内容'); return; }
    var link = firstUrl(t);
    var imp = link ? api('GET', '/api/import?url=' + encodeURIComponent(link)) : Promise.resolve(null);
    var anz = api('POST', '/api/analyze', { text: t });
    Promise.all([imp, anz]).then(function (rs) {
      btn.disabled = false; btn.textContent = '智能识别';
      var im = rs[0], j = rs[1];
      if (!j || !j.ok) { alert('识别失败'); return; }
      var place = (im && im.ok && im.place) ? im.place : j.place;
      var lat = (im && im.ok && im.lat) ? im.lat : j.lat;
      var lng = (im && im.ok && im.lng) ? im.lng : j.lng;
      if (place) document.getElementById('locPlace').value = place;
      if (lat) document.getElementById('locLat').value = lat;
      if (lng) document.getElementById('locLng').value = lng;
      var n = (im && im.ok && im.note) ? im.note : (j.note || '');
      if (n && !document.getElementById('locNote').value) document.getElementById('locNote').value = n;
    }).catch(function () { btn.disabled = false; btn.textContent = '智能识别'; alert('识别失败'); });
  };
  if (text) { done(text); }
  else { ocrImage(file).then(done).catch(function (e) { btn.disabled = false; btn.textContent = '智能识别'; alert('OCR 失败：' + e.message); }); }
};
document.getElementById('chgPass').onclick = function () {
  var cur = document.getElementById('curPass').value, nw = document.getElementById('newPass').value;
  if (nw.length < 4) { document.getElementById('chgTip').textContent = '新密码至少 4 位'; return; }
  api('POST', '/admin/changepass', { current: cur, next: nw }).then(function (j) {
    document.getElementById('chgTip').textContent = j.ok ? '密码已修改，下次登录用新密码' : (j.error || '失败');
    if (j.ok) { document.getElementById('curPass').value = ''; document.getElementById('newPass').value = ''; }
  });
};
</script>
</body>
</html>

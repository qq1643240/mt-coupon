name = "mt"
compatibility_date = "2025-01-01"
main = "worker.js"
workers_dev = true
preview_urls = true

# 静态资源（index.html / app.js / styles.css）由 Worker 的 assets 托管
[assets]
directory = "."
not_found_handling = "single-page-application"

# 后台管理存储（领券 / 定位 / 令牌 / 密码）：绑定 KV 命名空间
# 用 `npx wrangler kv namespace create ADMIN_KV` 创建后，把返回的 id 填到下面。
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "8aae838d29764033883709e9ba98d25f"

# 后台默认密码（首次登录用；登录后可在后台改密，改后写入 KV 覆盖此值）
# 密码已移出仓库，改为 Cloudflare Secret 存储，部署前执行：
#   npx wrangler secret put ADMIN_PASS
# 然后输入密码（当前为 6866）。未设置时回退到内置默认值。
# [vars]
# ADMIN_PASS = "6866"
